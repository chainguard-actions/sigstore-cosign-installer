name: Test cosign installation with custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install envsubst dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext-base

      - id: install
        uses: .
        with:
          cosign-release: 'v3.0.5'
          install-dir: /tmp/cosign-custom

      - name: Assert cosign binary exists at custom install dir
        run: |
          echo "Checking for cosign binary in /tmp/cosign-custom"
          if [ ! -f "/tmp/cosign-custom/cosign" ]; then
            echo "FAIL: cosign binary not found at /tmp/cosign-custom/cosign"
            ls -la /tmp/cosign-custom/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "PASS: cosign binary found"

      - name: Assert cosign is executable
        run: |
          if [ ! -x "/tmp/cosign-custom/cosign" ]; then
            echo "FAIL: cosign binary is not executable"
            exit 1
          fi
          echo "PASS: cosign binary is executable"

      - name: Assert cosign version matches requested version
        run: |
          VERSION_OUTPUT=$(/tmp/cosign-custom/cosign version 2>&1 || true)
          echo "cosign version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "3.0.5"; then
            echo "PASS: cosign version matches requested v3.0.5"
          else
            echo "FAIL: cosign version does not match requested v3.0.5"
            echo "Full output: $VERSION_OUTPUT"
            exit 1
          fi
