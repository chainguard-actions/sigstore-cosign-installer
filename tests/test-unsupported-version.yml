name: Test unsupported old version is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cosign-release: 'v1.13.1'
          install-dir: '$HOME/old-cosign'
      - name: Assert action failed and installed nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for cosign v1.13.1"
            exit 1
          fi
          if [ -e "$HOME/old-cosign/cosign" ]; then
            echo "FAIL: cosign should not have been installed"
            exit 1
          fi
          echo "PASS"
