name: Test cosign installation with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
        with:
          cosign-release: 'v2.4.1'
          install-dir: /tmp/cosign-specific
      - name: Assert cosign binary exists
        run: |
          echo "Checking cosign binary exists..."
          if [ ! -f /tmp/cosign-specific/cosign ]; then
            echo "FAIL: cosign binary not found in /tmp/cosign-specific"
            ls -la /tmp/cosign-specific/ || echo "(directory does not exist)"
            exit 1
          fi
          echo "PASS: cosign binary found"
      - name: Assert cosign is executable and reports correct version
        run: |
          echo "Checking cosign version..."
          VERSION_OUTPUT=$(/tmp/cosign-specific/cosign version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.4.1"; then
            echo "PASS: cosign version 2.4.1 confirmed"
          else
            echo "FAIL: expected version 2.4.1 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
