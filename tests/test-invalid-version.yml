name: Test invalid version string is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cosign-release: 'v9.9.9-bogus'
          install-dir: '$HOME/invalid-cosign'
      - name: Assert action failed and did not install cosign
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -la "$HOME/invalid-cosign" 2>/dev/null || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid version"
            exit 1
          fi
          if [ -e "$HOME/invalid-cosign/cosign" ]; then
            echo "FAIL: cosign should not have been installed"
            exit 1
          fi
          echo "PASS"
