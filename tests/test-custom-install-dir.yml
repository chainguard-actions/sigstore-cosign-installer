name: Test custom install dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure envsubst and curl are available (act image may lack them)
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO=sudo; fi
          if ! command -v envsubst >/dev/null || ! command -v curl >/dev/null; then
            ($SUDO apt-get update -qq && $SUDO apt-get install -y -qq gettext-base curl ca-certificates) || true
          fi
          if ! command -v envsubst >/dev/null; then
            echo "Installing envsubst shim"
            mkdir -p "$HOME/test-shims"
            cat > "$HOME/test-shims/envsubst" <<'EOF'
          #!/bin/bash
          while IFS= read -r line || [ -n "$line" ]; do
            eval "printf '%s\n' \"$line\""
          done
          EOF
            chmod +x "$HOME/test-shims/envsubst"
            echo "$HOME/test-shims" >> "$GITHUB_PATH"
          fi
          command -v curl || { echo "curl unavailable"; exit 1; }
      - id: action
        uses: .
        with:
          install-dir: '$HOME/custom-cosign-bin'
          cosign-release: 'v3.1.4'
          curl-retries: '3'
      - name: Assert cosign installed in custom dir
        run: |
          ls -la "$HOME/custom-cosign-bin" || true
          if [ ! -x "$HOME/custom-cosign-bin/cosign" ]; then
            echo "FAIL: cosign not found in $HOME/custom-cosign-bin"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom dir added to PATH
        run: |
          echo "PATH=$PATH"
          WHICH="$(command -v cosign || true)"
          echo "which: $WHICH"
          if [ "$WHICH" != "$HOME/custom-cosign-bin/cosign" ]; then
            echo "FAIL: cosign on PATH does not resolve to custom dir"
            exit 1
          fi
          cosign version
          echo "PASS"
