name: Test cosign installation with custom install directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
        with:
          install-dir: /tmp/cosign-custom-dir
      - name: Assert cosign binary exists in custom directory
        run: |
          echo "Checking cosign binary in custom directory..."
          if [ ! -f /tmp/cosign-custom-dir/cosign ]; then
            echo "FAIL: cosign binary not found in /tmp/cosign-custom-dir"
            ls -la /tmp/cosign-custom-dir/ || echo "(directory does not exist)"
            exit 1
          fi
          echo "PASS: cosign binary found at /tmp/cosign-custom-dir/cosign"
      - name: Assert cosign binary is executable
        run: |
          echo "Checking cosign is executable..."
          if [ ! -x /tmp/cosign-custom-dir/cosign ]; then
            echo "FAIL: cosign binary is not executable"
            exit 1
          fi
          echo "PASS: cosign binary is executable"
      - name: Assert custom dir is in PATH
        run: |
          echo "Checking custom dir is in PATH..."
          if ! command -v cosign > /dev/null 2>&1; then
            echo "FAIL: cosign not found in PATH after custom install"
            echo "PATH=$PATH"
            exit 1
          fi
          COSIGN_PATH=$(command -v cosign)
          echo "cosign found at: $COSIGN_PATH"
          if [[ "$COSIGN_PATH" != "/tmp/cosign-custom-dir/cosign" ]]; then
            echo "FAIL: cosign found at unexpected path: $COSIGN_PATH"
            exit 1
          fi
          echo "PASS: cosign found in custom install directory"
