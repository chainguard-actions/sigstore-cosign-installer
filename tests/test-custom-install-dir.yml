name: Test cosign installation with custom install directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure prerequisites are available
        run: |
          # envsubst is used by the action to expand $HOME in install-dir
          if ! command -v envsubst > /dev/null 2>&1; then
            echo "Installing gettext-base for envsubst..."
            apt-get update -qq && apt-get install -y -qq gettext-base
          else
            echo "envsubst already available: $(which envsubst)"
          fi

      - id: install
        uses: .
        with:
          cosign-release: 'v3.0.6'
          install-dir: '$HOME/custom-cosign-dir'

      - name: Assert cosign binary exists in custom install dir
        run: |
          INSTALL_DIR="$HOME/custom-cosign-dir"
          echo "Checking for cosign binary in: $INSTALL_DIR"
          ls -la "$INSTALL_DIR" || true
          if [ ! -f "$INSTALL_DIR/cosign" ]; then
            echo "FAIL: cosign binary not found at $INSTALL_DIR/cosign"
            exit 1
          fi
          echo "PASS: cosign binary found in custom directory"

      - name: Assert cosign is executable
        run: |
          INSTALL_DIR="$HOME/custom-cosign-dir"
          if [ ! -x "$INSTALL_DIR/cosign" ]; then
            echo "FAIL: cosign binary is not executable"
            exit 1
          fi
          echo "PASS: cosign binary is executable"

      - name: Assert cosign binary runs from custom dir
        run: |
          INSTALL_DIR="$HOME/custom-cosign-dir"
          VERSION_OUTPUT=$("$INSTALL_DIR/cosign" version 2>&1 || true)
          echo "cosign version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: cosign version produced no output"
            exit 1
          fi
          echo "PASS: cosign binary in custom dir is functional"

      - name: Assert custom dir is different from default dir
        run: |
          CUSTOM_DIR="$HOME/custom-cosign-dir"
          DEFAULT_DIR="$HOME/.cosign"
          if [ "$CUSTOM_DIR" = "$DEFAULT_DIR" ]; then
            echo "FAIL: custom dir is same as default dir"
            exit 1
          fi
          echo "PASS: custom install dir '$CUSTOM_DIR' is distinct from default '$DEFAULT_DIR'"
